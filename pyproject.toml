[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-dependency-graph"
version = "0.1.0"
description = "Constructs Python AST import call graphs and cross-references lockfiles (requirements.txt, poetry.lock, uv.lock, package-lock.json) to determine whether vulnerable transitive dependencies are reachable at runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
keywords = [
    "supply-chain-security",
    "dependency-graph",
    "reachability-analysis",
    "sca",
    "ast-analysis",
    "sarif",
    "logihertz",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-dependency-graph"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-dependency-graph"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-dependency-graph#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-dependency-graph/issues"

[project.scripts]
lh-depgraph = "lh_dependency_graph.cli:app"
lh-dependency-graph = "lh_dependency_graph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_dependency_graph"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

